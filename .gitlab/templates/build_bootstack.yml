.build:
  tags:
    - pegasus
  image: registry.gitlab.com/switchroot/bootstack/bootstack-build-scripts
  stage: build
  variables:
    DISTRO: ""
    CROSS_COMPILE: aarch64-linux-gnu-
  services:
    - docker:dind
  script:
    - DISTRO=${DISTRO} CPUS=$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- ./build.sh out/
