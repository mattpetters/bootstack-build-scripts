stages:
  - dependency_build
  - build

before_script:
  - mkdir -p "$CI_PROJECT_DIR/out/"

include:
  - local: .gitlab/templates/build_docker_ci_images.yml
  - local: .gitlab/templates/build_bootstack.yml

cbfstool:
  extends: .build
  variables:
    DISTRO: ubuntu
  artifacts:
    paths:
      - "$CI_PROJECT_DIR/switch-coreboot/util/cbfstool/cbfstool"

arch-build:
  extends: .build
  variables:
    DISTRO: arch

bullseye-build:
  extends: .build
  variables:
    DISTRO: bullseye

fedora-build:
  extends: .build
  variables:
    DISTRO: fedora

focal-build:
  extends: .build
  variables:
    DISTRO: focal

gentoo-build:
  extends: .build
  variables:
    DISTRO: gentoo

hirsute-build:
  extends: .build
  variables:
    DISTRO: hirsute

impish-build:
  extends: .build
  variables:
    DISTRO: impish

leap-build:
  extends: .build
  variables:
    DISTRO: leap

tumbleweed-build:
  extends: .build
  variables:
    DISTRO: tumbleweed
