stages:
  - dependency_build
  - build

before_script:
  - mkdir -p "$CI_PROJECT_DIR/out/"

include:
  - local: .gitlab/templates/build_docker_ci_images.yml
  - local: .gitlab/templates/build_bootstack.yml

arch-build:
  extends: .build
  variables:
    DISTRO: arch

bionic-build:
  extends: .build
  variables:
    DISTRO: bionic

centos-build:
  extends: .build
  variables:
    DISTRO: centos

debian-build:
  extends: .build
  variables:
    DISTRO: debian

fedora-build:
  extends: .build
  variables:
    DISTRO: fedora

focal-build:
  extends: .build
  variables:
    DISTRO: focal

groovy-build:
  extends: .build
  variables:
    DISTRO: groovy

leap-build:
  extends: .build
  variables:
    DISTRO: leap

tumbleweed-build:
  extends: .build
  variables:
    DISTRO: tumbleweed
